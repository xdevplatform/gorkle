[project]
name = "gorkle"
version = "0.1.0"
description = "PlayGorkle: a daily yes/no Chat Agent on X. Fork it and run your own."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "chatxdk",
  "pillow",
  "psycopg[binary,pool]",
  "xdk",
]

[project.urls]
Homepage = "https://github.com/xdevplatform/gorkle"
Documentation = "https://docs.x.com/xchat/introduction.md"
"X Chat" = "https://x.com/PlayGorkle"

[project.scripts]
gorkle = "gorkle.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gorkle*"]

[tool.setuptools.package-data]
gorkle = ["assets/*", "assets/fonts/*"]
