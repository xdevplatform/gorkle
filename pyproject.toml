[project]
name = "groks-secret"
version = "0.1.0"
description = "PlayGorkle: daily yes/no guessing game over X Chat as @PlayGorkle"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "chatxdk",
  "pillow",
  "psycopg[binary,pool]",
  "xdk",
]

[project.scripts]
groks-secret = "groks_secret.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["groks_secret*"]

[tool.setuptools.package-data]
groks_secret = ["assets/*"]
